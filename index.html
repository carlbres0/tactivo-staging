<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/tactivo-staging/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="Plan and run football sessions built for your team.">
  <meta name="theme-color" content="#0B0F10">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tactivo">
  <meta property="og:title" content="Tactivo — the home for football coaches">
  <meta property="og:description" content="Plan and run football sessions built for your team.">
  <meta property="og:url" content="https://app.tactivo.co.uk/">
  <meta property="og:image" content="https://app.tactivo.co.uk/icons/Icon-512.png">

  <!-- iOS home-screen install: Safari only delivers web push to an installed PWA. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tactivo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>Tactivo Staging</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0B0F10;
      overscroll-behavior: none;
    }
    /* Shown until the Flutter engine paints its first frame. Removed by main.dart.js
       taking over the body, so it needs no JS of its own. */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0B0F10;
    }
    #boot img {
      width: 96px;
      height: 96px;
      opacity: 0.9;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.9; }
    }
  </style>
</head>
<body>
  <div id="boot"><img src="icons/Icon-192.png" alt="Tactivo"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
