      height: 100%;
      background-color: #0B0F10;
      overscroll-behavior: none;
    }
    /* Shown until the Flutter engine paints its first frame. Removed by main.dart.js
       taking over the body, so it needs no JS of its own. */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0B0F10;
    }
    #boot img {
      width: 96px;
      height: 96px;
      opacity: 0.9;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.9; }
    }
