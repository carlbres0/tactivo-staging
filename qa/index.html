<!-- THIS FILE IS THE SOURCE of the drill QA board. Never edit a built copy.
     tool/build_review_artifact.py fills the two config/data placeholders below
     from the live corpus; tool/deploy_staging.sh runs it into <staging>/qa/.
     Do NOT spell those placeholder tokens anywhere else in this file: the
     builder does a plain str.replace, so a second copy of the token would be
     filled too — putting the Supabase key (and the whole corpus blob) into
     whatever text surrounds it. -->
<meta charset="utf-8">
<title>Drill QA Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">

<style id="app-css">
*, *::before, *::after { box-sizing: border-box; }
:root {
  --bg: #0B0F10;
  --card: #171B1F;
  --card2: #12171A;
  --border: #2A3036;
  --border-soft: #21262B;
  --lime: #C8F323;
  --ink: #0B0F10;
  --text: #FFFFFF;
  --body: #D5D9DC;
  --dim: #8D949B;
  --muted: #6F767D;
  --backdrop: #070B08;
  --bad: #F2555A;
  --warn: #E8B23D;
  /* app tokens, matched to lib/core/theme/app_colors.dart */
  --surface: #171B1F;
  --card2app: #191D21;
  --cardborder: #2A3036;
  --chipbg: #1A1D21;
  --pitchline: #2C3238;
  --r: 10px;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Archivo, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p, ol, ul { margin: 0; }
ol, ul { padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

/* ---------- unlock ---------- */
.lock { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.lockcard {
  width: 100%; max-width: 360px; display: grid; gap: 10px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 26px;
}
.lockcard span {
  font-size: 10px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--lime);
}
.lockcard h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
.lockcard p { color: var(--dim); font-size: 13px; margin-bottom: 6px; }
.lockcard input {
  width: 100%; padding: 11px 13px; border-radius: 9px;
  background: #101416; border: 1px solid var(--border);
}
.lockcard button {
  padding: 11px; border-radius: 9px; font-size: 14px; font-weight: 700;
  background: var(--lime); color: var(--ink);
}
.lockcard em {
  font-style: normal; font-size: 12px; color: var(--bad); min-height: 16px;
}

/* ---------- header ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center;
  padding: 14px 20px;
  background: rgba(11,15,16,.94);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand b { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
.brand span {
  font-size: 10px; font-weight: 700; letter-spacing: .14em;
  color: var(--lime); text-transform: uppercase;
}
.meter { display: flex; align-items: center; gap: 12px; }
.bar {
  width: 240px; max-width: 40vw; height: 8px; border-radius: 999px;
  background: #20262B; overflow: hidden; display: flex;
}
.bar i { display: block; height: 100%; }
.bar .ok { background: var(--lime); }
.bar .iss { background: var(--bad); }
.tally { display: flex; gap: 14px; font-size: 12px; font-variant-numeric: tabular-nums; }
.tally b { font-weight: 700; }
.tally .ok b { color: var(--lime); }
.tally .iss b { color: var(--bad); }
.tally .rec b { color: var(--lime); }
.tally span { color: var(--muted); }
.who {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--dim);
}
.who input {
  width: 120px; padding: 6px 10px; border-radius: 8px;
  background: #101416; border: 1px solid var(--border);
}
.save {
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); min-width: 92px; text-align: right;
}
.save[data-s="saving"] { color: var(--warn); }
.save[data-s="saved"] { color: var(--lime); }
.save[data-s="local"], .save[data-s="ro"] { color: var(--bad); }
.ghost {
  padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
  border: 1px solid var(--border); color: var(--body);
}
.ghost:hover { border-color: var(--lime); color: var(--lime); }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 296px minmax(0, 1fr); gap: 0; }
.side {
  border-right: 1px solid var(--border);
  height: calc(100vh - 57px); position: sticky; top: 57px;
  display: flex; flex-direction: column; min-height: 0;
}
.sidetop { padding: 14px; display: grid; gap: 10px; border-bottom: 1px solid var(--border-soft); }
.search {
  width: 100%; padding: 9px 12px; border-radius: 9px;
  background: #101416; border: 1px solid var(--border);
}
.search::placeholder { color: var(--muted); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  padding: 5px 10px; border-radius: 999px; font-size: 11px; font-weight: 600;
  border: 1px solid var(--border); color: var(--dim);
  font-variant-numeric: tabular-nums;
}
.pill[aria-pressed="true"] { background: var(--lime); border-color: var(--lime); color: var(--ink); }
/* The re-check pile is the one pile with someone waiting on it, so it wears
   the accent even when it is not the pill you are standing on. */
.pill.hot { border-color: var(--lime); color: var(--lime); }
.pill.hot[aria-pressed="true"] { color: var(--ink); }
.list { overflow-y: auto; padding: 8px 8px 40px; flex: 1; min-height: 0; }
.grouphead {
  padding: 14px 8px 6px; font-size: 10px; font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.row {
  display: grid; grid-template-columns: 8px minmax(0,1fr) auto;
  gap: 9px; align-items: center; width: 100%; text-align: left;
  padding: 8px 10px; border-radius: 8px; color: var(--body);
}
.row:hover { background: #151A1D; }
.row[aria-current="true"] { background: #1C2226; color: var(--text); }
.row .dot { width: 8px; height: 8px; border-radius: 50%; background: #333A40; }
.row[data-st="ok"] .dot { background: var(--lime); }
.row[data-st="issue"] .dot { background: var(--bad); }
.row[data-st="partial"] .dot { background: var(--warn); }
.row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.row .tag { font-size: 9px; font-weight: 700; letter-spacing: .1em; color: var(--muted); }

/* ---------- main ---------- */
.main { padding: 20px; display: grid; gap: 18px; align-content: start; min-width: 0; }
.dhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 14px; }
.dhead h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
.did { font-family: var(--mono); font-size: 11px; color: var(--muted); }
/* The drill id is what Carl quotes back in feedback, so it is a first-class
   thing on the page and one click puts it on the clipboard. */
.didbtn {
  font-family: var(--mono); font-size: 13px; font-weight: 600;
  padding: 4px 9px; border-radius: 6px; color: var(--lime);
  background: #1A1F23; border: 1px solid var(--border);
}
.didbtn:hover { border-color: var(--lime); }
.didbtn[data-copied="1"] { background: var(--lime); color: var(--ink); border-color: var(--lime); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 4px 9px; border-radius: 6px; font-size: 11px; font-weight: 600;
  background: #1A1F23; color: var(--dim); border: 1px solid var(--border-soft);
}
.chip.lime { background: #273116; color: #E4F7B0; border-color: #313B17; }
/* Loud on purpose: a candidate is not in the app, and a reviewer who misses
   that will file "the animation is broken" against a drill that has none. */
.chip.cand {
  background: #3A2A08; color: #FFD37A; border-color: #5A4310;
  letter-spacing: .1em; font-weight: 800;
}

/* ---------- the app, reproduced ----------
   Every number below is lifted from lib/features/drill_details and
   lib/core/theme, so what a reviewer marks is what a coach sees. */
/* Card and 3D pane side by side: "do the two agree?" is only a fair question
   if both are on screen at once. Collapses to one column when there is not
   room for the app's own 480px card plus a usable 3D box. */
.appwrap {
  display: grid; grid-template-columns: minmax(0, 480px) minmax(0, 1fr);
  gap: 14px; align-items: start; justify-items: center;
}
.appwrap .viewtabs { grid-column: 1 / -1; }
.appwrap.flat { grid-template-columns: minmax(0, 480px); justify-content: center; }
@media (max-width: 1320px) { .appwrap { grid-template-columns: minmax(0, 1fr); } }
.frame {
  width: 100%; max-width: 480px;                 /* AppSizes.authMaxContentWidth */
  background: var(--bg);
  border: 1px solid var(--border); border-radius: 22px;
  padding: 18px;                                  /* drillDetailPageHorizontal/TopPad */
  overflow: hidden;
}
.viewtabs { display: flex; gap: 4px; }
.viewtab {
  padding: 5px 11px; border-radius: 7px; font-size: 11px; font-weight: 600;
  border: 1px solid var(--border); color: var(--muted);
}
.viewtab[aria-pressed="true"] { background: #1C2226; border-color: var(--lime); color: var(--lime); }

.appback {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--border); color: var(--body);
  display: grid; place-items: center; font-size: 15px;
  margin-bottom: 24px;                            /* drillDetailHeaderToChips */
}
.appchips { display: flex; flex-wrap: wrap; gap: 8px 8px; margin-bottom: 10px; }
.appchip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 7px; border-radius: 5px;
  font-size: 8.5px; font-weight: 600; letter-spacing: .3px; line-height: 1.2;
  text-transform: uppercase;
  background: var(--chipbg); border: 1px solid #313339; color: var(--dim);
}
.appchip.lime { background: #313B17; border: 0; color: var(--lime); }
.appchip svg { width: 11px; height: 11px; }
.apptitle {
  font-size: 21px; font-weight: 800; letter-spacing: .3px; line-height: 1.05;
  text-transform: uppercase; margin-bottom: 14px;
}
/* A candidate's flat coaching diagram takes the stage box's place. It is a
   plain SVG that sizes itself, so there is no fixed height to fight over. */
.flatdiagram { background: var(--backdrop); border-radius: 12px; padding: 10px 10px 2px; }
.flatdiagram svg { display: block; width: 100%; height: auto; border-radius: 8px; }
.diagram { height: 240px; display: flex; flex-direction: column; }
.diagram.replay { height: 400px; }
.stagebox { flex: 1; min-height: 0; border-radius: 12px; overflow: hidden; background: var(--backdrop); }
.stagebox canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.stagebox canvas:active { cursor: grabbing; }
.capline { display: flex; align-items: flex-start; gap: 8px; padding-top: 8px; }
.capplay {
  width: 32px; height: 32px; flex: none; color: var(--lime);
  font-size: 15px; display: grid; place-items: center;
}
.captext { font-size: 12.5px; line-height: 1.3; color: var(--body); }
.dashes { display: flex; gap: 5px; margin-top: 4px; }
.dashes i {
  width: 18px; height: 3px; border-radius: 2px;
  background: var(--pitchline); overflow: hidden;
}
.dashes i b { display: block; height: 100%; width: 0; background: var(--lime); }
.capnote {
  text-align: right; font-size: 9.5px; line-height: 1.2;
  color: var(--dim); margin-top: 6px;
}
.dircams { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.dircam {
  padding: 8px 12px; border-radius: 9px; font-size: 11px; font-weight: 600;
  background: var(--surface); border: 1px solid var(--cardborder); color: var(--dim);
}
.dircam[aria-pressed="true"] { background: var(--lime); border-color: var(--lime); color: var(--ink); }

/* The three stage modes the app itself offers, in the app's own words. These
   are the point of the 2D pane; the broadcast presets above are a director's
   toy and only appear in full-screen replay. */
.stagetabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.stagetab {
  padding: 7px 11px; border-radius: 9px; font-size: 11px; font-weight: 600;
  background: var(--surface); border: 1px solid var(--cardborder); color: var(--dim);
}
.stagetab i { font-style: normal; color: var(--muted); font-weight: 400; }
.stagetab[aria-pressed="true"] { background: var(--lime); border-color: var(--lime); color: var(--ink); }
.stagetab[aria-pressed="true"] i { color: var(--ink); opacity: .7; }
.stagenote { margin-top: 6px; font-size: 10px; line-height: 1.35; color: var(--dim); }
.stagenote b { color: var(--muted); font-weight: 700; letter-spacing: .08em; }

/* ---------- the 3D pane ---------- */
/* Sticky, because the drill card is far taller than the 3D box: the whole
   point is that both are on screen at the same time, all the way down the
   instructions. */
.pane3d { width: 100%; display: grid; gap: 8px; align-content: start;
  position: sticky; top: 73px; }
.paneh {
  display: flex; align-items: baseline; gap: 8px;
  font-size: 10px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted);
}
.paneh em { font-style: normal; letter-spacing: 0; text-transform: none; font-weight: 500; }
.paneh em[data-s="error"] { color: var(--bad); }
.paneh em[data-s="ready"] { color: var(--lime); }
.slot3d {
  width: 100%; height: min(58vh, 520px); min-height: 300px;
  border-radius: 12px; background: var(--backdrop);
}
@media (max-width: 1320px) { .pane3d { position: static; } .slot3d { height: 380px; } }
/* The iframe is parked over .slot3d rather than inside it: render() replaces
   #root wholesale and re-parenting an iframe reloads it, which would reboot
   the 13 MB engine on every keystroke. Position is re-synced on the frame
   loop, so it tracks scrolling and resizes for free. */
.pane3dhost {
  position: fixed; z-index: 5; display: none;
  border-radius: 12px; overflow: hidden; background: var(--backdrop);
}
.pane3dhost iframe { display: block; width: 100%; height: 100%; border: 0; }
.pane3dhost .msg {
  position: absolute; inset: 0; display: grid; place-content: center;
  justify-items: center; gap: 5px;
  padding: 16px; text-align: center; font-size: 12px; color: var(--dim);
  background: var(--backdrop);
}
.pane3dhost .msg[hidden] { display: none; }
.pane3dhost .msg b { display: block; color: var(--bad); font-weight: 600; }
.pane3dhost .msg i { display: block; font-style: normal; color: var(--muted); font-size: 11px; }
.pane3dhost .msg .msgretry {
  margin-top: 8px; padding: 6px 12px; border-radius: 8px; font-size: 11px;
  font-weight: 600; cursor: pointer;
  background: var(--surface); border: 1px solid var(--cardborder); color: var(--text);
}

/* ---------- feedback tags ---------- */
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.tagbtn {
  padding: 4px 9px; border-radius: 999px; font-size: 11px; font-weight: 600;
  border: 1px solid var(--border); color: var(--dim);
}
.tagbtn:hover { border-color: var(--lime); color: var(--lime); }
.tagbtn[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.applabel {
  color: var(--lime); font-size: 10px; font-weight: 600;
  letter-spacing: .6px; line-height: 1.2; margin: 16px 0 10px;
}
.appsteps { display: grid; gap: 10px; }
.appstep { display: grid; grid-template-columns: 18px minmax(0,1fr); gap: 10px; }
.appstep b {
  width: 18px; height: 18px; margin-top: 1px; border-radius: 50%;
  background: var(--lime); color: var(--ink);
  font-size: 10px; font-weight: 700; line-height: 1.1;
  display: grid; place-items: center;
}
.appstep span { font-size: 12px; line-height: 1.45; color: var(--body); font-weight: 400; }
.skillgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.skillpill {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 12px; border-radius: 12px;
  background: var(--card2app); border: 1px solid var(--cardborder);
}
.skillpill svg { width: 30px; height: 30px; flex: none; }
.skillpill span { font-size: 11.5px; font-weight: 600; line-height: 1.25; }
.coachtip {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 11px 12px; border-radius: 10px; background: #313B17; margin-top: 16px;
}
.coachtip svg { width: 28px; height: 28px; flex: none; color: var(--lime); }
.coachtip b {
  display: block; color: #E4F7B0; font-size: 11.5px; font-weight: 700;
  letter-spacing: .4px; line-height: 1.4;
}
.coachtip i { color: #E4F7B0; font-size: 11.5px; line-height: 1.4; }
.adapt { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.adapt > div {
  padding: 10px; border-radius: 12px;
  background: var(--card2app); border: 1px solid var(--cardborder);
}
.adapt b {
  display: block; color: var(--dim); font-size: 10px; font-weight: 600;
  letter-spacing: .6px; line-height: 1.2; margin-bottom: 4px;
}
.adapt p { color: var(--dim); font-size: 11px; line-height: 1.35; white-space: pre-line; }

.cols { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 18px; align-items: start; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; }
.card h2 {
  font-size: 10px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
}

/* ---------- review ---------- */
.review { position: sticky; top: 73px; }
/* Our fix line, lifted out of the note and put where the eye lands first.
   The textarea below still holds the whole raw note — this is a reading of
   it, not a copy, so nothing the coach wrote can be lost here. */
.recheck {
  margin-bottom: 14px; padding: 10px 12px; border-radius: 9px;
  background: rgba(200, 243, 35, .07);
  border: 1px solid rgba(200, 243, 35, .34);
  border-left: 3px solid var(--lime);
}
.recheck b {
  display: block; font-size: 11px; font-weight: 800; letter-spacing: .07em;
  text-transform: uppercase; color: var(--lime); line-height: 1.35;
}
.recheck p { margin-top: 5px; font-size: 12.5px; line-height: 1.45; color: var(--body); }
.recheck .was {
  margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--border-soft);
  font-size: 11.5px; line-height: 1.45; color: var(--muted); white-space: pre-line;
}
.crit { display: grid; gap: 10px; margin-bottom: 14px; }
.crit > div { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; align-items: center; }
.crit .lab { font-size: 13px; font-weight: 600; }
.crit .lab em { display: block; font-style: normal; font-size: 11px; color: var(--muted); font-weight: 400; }
.yn { display: flex; gap: 4px; }
.yn button {
  width: 34px; height: 30px; border-radius: 8px; font-size: 13px; font-weight: 700;
  border: 1px solid var(--border); color: var(--dim);
}
.yn button[aria-pressed="true"][data-v="1"] { background: var(--lime); border-color: var(--lime); color: var(--ink); }
.yn button[aria-pressed="true"][data-v="0"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.note {
  width: 100%; min-height: 96px; resize: vertical; padding: 10px 12px;
  border-radius: 9px; background: #101416; border: 1px solid var(--border);
  line-height: 1.5;
}
.note::placeholder { color: var(--muted); }
.stamp { margin-top: 8px; font-size: 11px; color: var(--muted); min-height: 16px; }
.acts { display: grid; gap: 8px; margin-top: 14px; }
.acts button {
  padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700;
  border: 1px solid var(--border); color: var(--body);
}
.acts .good { background: var(--lime); border-color: var(--lime); color: var(--ink); }
.acts .good:hover { background: #ADD51A; border-color: #ADD51A; }
.acts .skip:hover { border-color: var(--lime); color: var(--lime); }
.back { margin-top: 8px; font-size: 12px; color: var(--muted); }
.back:hover { color: var(--lime); }
.keys { margin-top: 12px; font-size: 11px; color: var(--muted); line-height: 1.7; }
.keys kbd {
  font-family: var(--mono); font-size: 10px; padding: 1px 5px; border-radius: 4px;
  background: #1A1F23; border: 1px solid var(--border);
}
.banner {
  padding: 10px 14px; border-radius: 9px; font-size: 13px;
  background: #2A1416; border: 1px solid #4A2226; color: #FFD9DA;
}
@media (max-width: 1080px) {
  .cols { grid-template-columns: minmax(0,1fr); }
  .review { position: static; }
}
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0,1fr); }
  .side { position: static; height: auto; max-height: 300px; border-right: 0; border-bottom: 1px solid var(--border); }
  .main { padding: 14px; }
}

  // the movement runs at exactly the pace it was authored. Stretching the
  // movement to reading speed made players drift unnaturally; this keeps words
  // and motion overlapping rather than queued.
  var WORDS_PER_MINUTE = 160;   // the broadcast subtitle floor
  var ORIENTATION_MS = 600;     // noticing the caption changed
  var BEAT_SHARE = 0.6;         // the rest is read while the movement plays
  var MAX_BEAT_MS = 2600;       // no beat outstays its welcome

  function rowsToState(rows) {

        if (Object.keys(dirty).length) {

  /* ============ the 3D pane ============

  var f3 = null;              // { host, frame, msg }

  var f3errKey = null;        // the drill the CURRENT error is actually about
  var f3slow = false;         // taking a while — not the same as not being there

  function mount3d() {
    if (f3) return;
    var host = document.createElement("div");
    host.className = "pane3dhost";
    var fr = document.createElement("iframe");

    fr.setAttribute("loading", "eager");
    var msg = document.createElement("div");
    msg.className = "msg";

    // click handler, so the retry gets its own listener.
    msg.addEventListener("click", function (ev) {
      if (ev.target.classList.contains("msgretry") && f3hello) load3d(ui.sel);
    });
    host.appendChild(fr);
    host.appendChild(msg);
    document.body.appendChild(host);
    f3 = { host: host, frame: fr, msg: msg };
    window.addEventListener("message", on3d);
    // "Not here" and "not here YET" are different claims, and the board used to
    // make the first one after 15s. A cold engine is a 13 MB download; on a
    // phone on hotel wifi that is easily a minute. So: 15s only softens the
    // wording, a genuine iframe load error says it immediately, and the
    // deployment claim waits two minutes.

      if (!f3hello) { f3state = "absent"; paint3d(); }
    });

      if (!f3hello) { f3slow = true; paint3d(); }
    }, 15000);

    }, 120000);

  function post3d(m) {
    if (f3 && f3.frame.contentWindow) f3.frame.contentWindow.postMessage(m, "*");
  }
